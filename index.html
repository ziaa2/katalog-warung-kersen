<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="Katalog digital Warung">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Warung — Katalog</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="brand-mark">W</span><span><b>WARUNG</b><small>Katalog Online</small></span></a>
    <button id="themeBtn" class="icon-btn" aria-label="Ubah tema">☼</button>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <span class="eyebrow">BELANJA CEPAT</span>
        <h1>Barang warung,<br><em>langsung pesan.</em></h1>
        <p>Pilih barang, atur jumlah, lalu kirim pesanan langsung ke WhatsApp.</p>
      </div>
    </section>

    <section class="toolbar">
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Cari barang atau merek..." autocomplete="off"></label>
      <div id="categories" class="chips"></div>
    </section>

    <section id="productGrid" class="product-grid"></section>
    <div id="empty" class="empty hidden">Barang tidak ditemukan.</div>
  </main>

  <aside id="cartBar" class="cart-bar hidden">
    <div><b id="cartCount">0 barang</b><span id="cartTotal">Rp0</span></div>
    <button id="openCart" class="primary">Lihat keranjang →</button>
  </aside>

  <dialog id="cartDialog">
    <div class="dialog-head"><h2>Keranjang</h2><button class="icon-btn" id="closeCart">×</button></div>
    <div id="cartItems"></div>
    <div class="cart-summary"><span>Total sementara</span><strong id="dialogTotal">Rp0</strong></div>
    <label class="field"><span>Nama (opsional)</span><input id="customerName" placeholder="Nama kamu"></label>
    <label class="field"><span>Catatan (opsional)</span><textarea id="customerNote" rows="2" placeholder="Contoh: antar ke rumah..."></textarea></label>
    <button id="waOrder" class="wa primary">Pesan via WhatsApp</button>
    <p class="muted">Harga dan stok dapat dikonfirmasi kembali oleh admin.</p>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
