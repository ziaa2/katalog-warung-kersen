<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Warung Berkah — Katalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="brand" id="brandTrigger" title="">
      <span class="brand-mark">WB</span>
      <div class="brand-text">
        <strong id="storeName">Warung Berkah</strong>
        <small>Sembako &amp; kebutuhan harian</small>
      </div>
    </div>
    <button class="admin-exit" id="btnExitAdmin" hidden>Keluar admin</button>
  </header>

  <main>
    <section class="toolbar">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="Cari beras, minyak, gula...">
      </div>
      <div class="chips" id="categoryChips"></div>
    </section>

    <p id="syncState" class="empty">Memuat katalog...</p>
    <section id="catalogGrid" class="grid"></section>
    <p id="emptyState" class="empty" hidden>Belum ada produk yang cocok.</p>
  </main>

  <!-- Tombol WA mengambang -->
  <a id="waFloat" class="wa-float" target="_blank" rel="noopener" aria-label="Pesan lewat WhatsApp">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="white"><path d="M16 3C9.4 3 4 8.4 4 15c0 2.4.7 4.6 1.9 6.5L4 29l7.7-2c1.8 1 3.9 1.5 6.3 1.5 6.6 0 12-5.4 12-12S22.6 3 16 3zm0 2c5.5 0 10 4.5 10 10s-4.5 10-10 10c-2 0-3.9-.6-5.5-1.6l-.4-.2-4.6 1.2 1.2-4.5-.2-.4C5.6 18.4 5 16.7 5 15 5 9.5 9.5 5 16 5zm-3.9 5.3c-.2 0-.5 0-.7.3-.2.2-.9.9-.9 2.2s1 2.6 1.1 2.7c.1.2 1.9 3 4.7 4.1 2.3.9 2.8.8 3.3.7.5-.1 1.6-.7 1.8-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.5-.3-.2-.1-1.6-.8-1.8-.9-.2-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.5.1-.3-.1-1.1-.4-2.1-1.3-.8-.7-1.3-1.6-1.5-1.8-.1-.3 0-.4.1-.5l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.6-1.6-.9-2.1-.2-.5-.4-.4-.6-.4z"/></svg>
  </a>

  <!-- Panel Admin -->
  <div id="adminOverlay" class="overlay" hidden>
    <div class="admin-panel">
      <div class="admin-head">
        <h2>Kelola Katalog</h2>
        <button id="btnCloseAdmin" class="icon-btn">✕</button>
      </div>

      <form id="productForm" class="admin-form">
        <input type="hidden" id="productId">
        <div class="field-row">
          <label>Nama produk
            <input type="text" id="fName" required placeholder="Beras Pandan Wangi 5kg">
          </label>
          <label>Kategori
            <input type="text" id="fCategory" required placeholder="Beras & Tepung">
          </label>
        </div>
        <div class="field-row">
          <label>Harga (Rp)
            <input type="number" id="fPrice" required min="0" placeholder="65000">
          </label>
          <label>Stok
            <select id="fStock">
              <option value="ada">Tersedia</option>
              <option value="habis">Habis</option>
            </select>
          </label>
        </div>
        <label>Gambar produk
          <input type="file" id="fImageFile" accept="image/*">
        </label>
        <label>atau tempel URL gambar
          <input type="text" id="fImageUrl" placeholder="https://...">
        </label>
        <label>Catatan singkat (opsional)
          <textarea id="fDesc" rows="2" placeholder="Contoh: bisa beli eceran"></textarea>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="btnSave">Tambah produk</button>
          <button type="button" class="btn-ghost" id="btnCancelEdit" hidden>Batal edit</button>
        </div>
      </form>

      <hr>

      <div class="admin-settings">
        <h3>Pengaturan toko</h3>
        <div class="field-row">
          <label>Nama toko
            <input type="text" id="sStoreName" placeholder="Warung Berkah">
          </label>
          <label>Nomor WhatsApp (62xxxxxxxxxx)
            <input type="text" id="sWaNumber" placeholder="6281234567890">
          </label>
        </div>
        <button id="btnSaveSettings" class="btn-primary">Simpan pengaturan</button>
      </div>

      <hr>

      <h3>Daftar produk (<span id="adminCount">0</span>)</h3>
      <div id="adminList" class="admin-list"></div>
    </div>
  </div>

  <!-- Modal kode admin -->
  <div id="pinOverlay" class="overlay" hidden>
    <div class="pin-box">
      <h3>Masuk Admin</h3>
      <p>Masukkan kode akses</p>
      <input type="password" id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••">
      <div class="form-actions">
        <button id="btnPinOk" class="btn-primary">Masuk</button>
        <button id="btnPinCancel" class="btn-ghost">Batal</button>
      </div>
      <p id="pinError" class="pin-error" hidden>Kode salah, coba lagi.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
